name: Build Desktop Buddy

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, no .NET install needed)
        run: dotnet publish DesktopBuddy/DesktopBuddy.csproj -c Release -r win-x64 --self-contained true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopBuddy-win-x64
          path: publish/
